<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YPP Fiber Broadband – Chikhali & Dehugaon</title>
<meta name="description" content="YPP Fiber Broadband: fast, low-cost unlimited fiber internet with WiFi in Chikhali and Dehugaon. Plans from ₹399/month, no deposit, no annual contracts.">
<style>
:root{--bg:#fff;--bg2:#f4f7fc;--tx:#0f1b33;--mu:#5b6780;--red:#e63946;--or:#ff7a1a;--bl:#1d4ed8;--bd:#dbe3f0;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--bg2:#111a2e;--tx:#eef2fb;--mu:#9aa7c2;--bd:#25314d;--card:#142038;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--bg2:#111a2e;--tx:#eef2fb;--mu:#9aa7c2;--bd:#25314d;--card:#142038;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--bd)}
.nav{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--red)}.logo i{color:var(--bl);font-style:normal}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{padding:6px 12px;border-radius:99px;font-size:14px;white-space:nowrap;color:var(--mu)}
nav a.on,nav a:hover{background:var(--bg2);color:var(--tx)}
main{max-width:1100px;margin:auto;padding:24px 16px 56px}
.hero{background:linear-gradient(135deg,var(--red),var(--or) 55%,var(--bl));color:#fff;border-radius:20px;padding:40px 24px;text-align:center}
.hero h1{font-size:clamp(28px,6vw,48px);margin:0 0 10px;line-height:1.1}.hero p{margin:0 auto 22px;max-width:520px;opacity:.95}
.btn{display:inline-block;padding:11px 20px;border-radius:10px;font-weight:600;border:0;cursor:pointer;font-size:15px;background:var(--red);color:#fff}
.btn.w{background:#fff;color:var(--red)}.btn.o{background:transparent;color:#fff;border:2px solid #fff}.btn.b{background:var(--bl)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
h2{font-size:26px;margin:36px 0 14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.card h3{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--mu);font-size:14px}
.ico{font-size:26px}
.stats .card{text-align:center}.stats b{font-size:32px;color:var(--bl);display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.tabs button.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.plan{text-align:center;position:relative}.plan .sp{font-size:34px;font-weight:800;color:var(--bl)}.plan .sp small{font-size:15px}
.plan .pr{font-size:28px;font-weight:800;margin:8px 0}.plan ul{list-style:none;padding:0;margin:10px 0 14px;color:var(--mu);font-size:14px}
.plan.pop{border:2px solid var(--or)}.tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--or);color:#fff;font-size:12px;padding:2px 10px;border-radius:99px}
form{display:grid;gap:12px;max-width:640px}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
label{font-size:13px;color:var(--mu);display:grid;gap:4px}
input,select,textarea{padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;width:100%}
.ok{background:#e7f8ee;color:#136c3a;padding:12px;border-radius:10px;margin-top:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:#e7f8ee;color:#136c3a}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
.scroll{overflow-x:auto}
.bar{height:10px;background:var(--bg2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--or),var(--red))}
.pay{cursor:pointer;text-align:center;font-weight:600}.pay.on{border:2px solid var(--bl)}
details{border-bottom:1px solid var(--bd);padding:10px 0}summary{cursor:pointer;font-weight:600}
.map{height:240px;border-radius:14px;background:repeating-linear-gradient(45deg,var(--bg2),var(--bg2) 12px,var(--card) 12px,var(--card) 24px);display:grid;place-items:center;text-align:center;color:var(--mu);border:1px solid var(--bd);padding:16px}
footer{border-top:1px solid var(--bd);text-align:center;padding:20px;color:var(--mu);font-size:13px}
</style></head><body>
<header><div class="nav"><a class="logo" href="#home"><b>YPP</b> <i>Fiber Broadband</i></a><nav id="nav"></nav></div></header>
<main id="app"></main>
<footer>© 2026 YPP Fiber Broadband · Chikhali | Dehugaon · 98814 23530 · raj860077@gmail.com · SSL-ready · Demo UI</footer>
<script>
const P=[[30,399,1185,null,null],[50,499,1497,2394,4788],[100,599,1797,3480,5988]];
const D=["1 Month","3 Months","6 Months","12 Months"];
const AREAS=["Chikhali","Dehugaon","Nearby areas"];
const PAGES=["home","plans","connect","portal","pay","support","coverage","contact"];
const LBL={home:"Home",plans:"Plans",connect:"New Connection",portal:"My Account",pay:"Pay Bill",support:"Support",coverage:"Coverage",contact:"Contact"};
const inr=n=>"₹"+n.toLocaleString("en-IN");
let dur=0,logged=false,method="UPI";
const f=(id,l,t="text",req=1)=>`<label>${l}<input name="${id}" type="${t}" ${req?"required":""}></label>`;
const planOpts=()=>P.map(p=>`<option>${p[0]} Mbps</option>`).join("");
const done=m=>`<div class="ok">${m}</div>`;
const V={
home:()=>`<section class="hero"><h1>Super Fast Fiber Broadband</h1><p style="font-size:20px;font-weight:600">Fast Low-Cost Internet with WiFi</p><p>Improve your web experience. No annual contracts, no deposit, free installation up to 1 year.</p>
<div class="row"><a class="btn w" href="#connect">Get New Connection</a><a class="btn o" href="#coverage">Check Availability</a><a class="btn o" href="#plans">View Plans</a></div></section>
<h2>Why RK Telecom</h2><div class="grid">${[["♾️","Unlimited Internet","No FUP worries, stream and work freely."],["⚡","Fast Installation","Free installation up to 1 year."],["🔆","Fiber Optic Network","Symmetric, low-latency FTTH connectivity."],["🎧","24/7 Customer Support","Call, chat or WhatsApp any time."],["🔒","Secure Connection","Protected network and encrypted payments."]].map(x=>`<div class="card"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}</div>
<h2>Our network in numbers</h2><div class="grid stats">${[["10000","Happy homes"],["50","Societies covered"],["99","% uptime"],["24","Hours support (×7)"]].map(s=>`<div class="card"><b data-n="${s[0]}">0</b>${s[1]}</div>`).join("")}</div>
<h2>What customers say</h2><div class="grid">${[["Sneha K., Chikhali","Installed in two days and speeds match the plan. Great value."],["Amit D., Dehugaon","Work-from-home calls never drop now. Support is quick."],["Priya M., Chikhali","Paying bills online is simple. Highly recommended."]].map(t=>`<div class="card"><p>“${t[1]}”</p><h3 style="margin-top:10px;font-size:14px">⭐⭐⭐⭐⭐ ${t[0]}</h3></div>`).join("")}</div>`,
plans:()=>`<h2 style="margin-top:0">Unlimited Plans for Residential</h2><div class="tabs">${D.map((d,i)=>`<button class="${i==dur?"on":""}" onclick="dur=${i};go()">${d}</button>`).join("")}</div>
<div class="grid">${P.map((p,i)=>`<div class="card plan ${i==1?"pop":""}">${i==1?'<span class="tag">Most Popular</span>':""}<div class="sp">${p[0]}<small> Mbps</small></div><div class="pr">${p[dur+1]==null?'<span style="font-size:18px;color:var(--mu)">Not available</span>':inr(p[dur+1])+'<small style="font-size:13px;color:var(--mu)"> / '+D[dur]+'</small>'}</div><ul><li>Unlimited data</li><li>No annual contracts</li><li>No deposit</li><li>Free installation up to 1 year</li></ul><a class="btn" href="#connect">Choose Plan</a></div>`).join("")}</div>`,
connect:()=>`<h2 style="margin-top:0">New Connection</h2><form onsubmit="sub(event,'Thank you! Your request is received. Our team will call you shortly.')">
${f("n","Full Name")}<div class="two">${f("m","Mobile Number","tel")}${f("e","Email","email")}</div>${f("a","Address")}
<div class="two">${f("ar","Area")}${f("s","Society Name")}${f("w","Wing","text",0)}${f("fl","Floor")}${f("fn","Flat Number")}</div>
<label>Plan Selected<select>${planOpts()}</select></label><button class="btn">Submit Request</button></form>`,
portal:()=>!logged?`<h2 style="margin-top:0">Customer Login</h2><form onsubmit="event.preventDefault();logged=true;go()">${f("u","Mobile Number / Email")}${f("p","Password","password")}<button class="btn b">Login</button><a href="#support" style="color:var(--bl);font-size:14px">Forgot Password?</a><small style="color:var(--mu)">Demo: any details work. Real JWT login needs the backend.</small></form>`
:`<h2 style="margin-top:0">Welcome back, Customer</h2><div class="grid">
<div class="card"><h3>Account Details</h3><p>ID YPP10234 · Chikhali, Pune<br>Status: <span class="pill">Active</span></p></div>
<div class="card"><h3>Current Plan</h3><p>100 Mbps · ${inr(599)}/month<br>Renews 28 Nov 2026</p><a class="btn" style="margin-top:10px" href="#pay">Renew Plan</a></div>
<div class="card"><h3>Data Usage</h3><p>412 GB this month (Unlimited)</p><div class="bar" style="margin-top:8px"><i></i></div></div>
<div class="card"><h3>Payment Status</h3><p><span class="pill">Paid</span> Oct 2026</p></div></div>
<h2>Billing History</h2><div class="card scroll"><table><tr><th>Invoice</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr>${[["INV-1003","28 Oct 2026"],["INV-0987","28 Sep 2026"],["INV-0961","28 Aug 2026"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${inr(599)}</td><td><span class="pill">Paid</span></td><td><a href="#portal" style="color:var(--bl)" onclick="alert('Invoice PDF download needs the backend.')">Download</a></td></tr>`).join("")}</table></div>
<h2>Service Requests</h2><form onsubmit="sub(event,'Service request logged. Ticket #YPP-2041.')"><label>Issue<select><option>Slow speed</option><option>No connectivity</option><option>Shift connection</option></select></label><button class="btn">Raise Request</button></form>
<p><button class="btn b" onclick="logged=false;go()">Logout</button></p>`,
pay:()=>`<h2 style="margin-top:0">Online Payment</h2><p style="color:var(--mu)">Powered by Razorpay (checkout simulated in this demo).</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${["Razorpay","UPI","Google Pay","PhonePe","Credit Card","Debit Card","Net Banking"].map(m=>`<div class="card pay ${m==method?"on":""}" onclick="method='${m}';go()">${m}</div>`).join("")}</div>
<form style="margin-top:18px" onsubmit="sub(event,'Demo only: '+method+' selected. Live payment needs Razorpay keys and the backend.')">${f("c","Customer ID / Mobile")}<label>Amount<select>${P.map(p=>`<option>${inr(p[1])} – ${p[0]} Mbps, 1 Month</option>`).join("")}</select></label><button class="btn">Pay with ${method}</button></form>`,
support:()=>`<h2 style="margin-top:0">Support</h2><div class="grid"><div class="card"><h3>💬 Live Chat</h3><p>Chat with us, available 24/7.</p></div><div class="card"><h3>🟢 WhatsApp</h3><p><a href="https://wa.me/919834163330?text=Hello%20YPP%20Fiber%20Broadband" style="color:var(--bl)">Message us on 98341 63330</a></p></div><div class="card"><h3>🛠️ Installation Support</h3><p>Track or reschedule your install visit. Call <a href="tel:+919834163330" style="color:var(--bl)">98341 63330</a>.</p></div></div>
<h2>Raise a Ticket</h2><form onsubmit="sub(event,'Ticket created. We will respond within 4 hours.')">${f("m","Mobile Number","tel")}<label>Category<select><option>Technical</option><option>Billing</option><option>Installation</option></select></label><label>Describe the issue<textarea rows="4" required></textarea></label><button class="btn">Submit Ticket</button></form>
<h2>FAQ</h2>${[["How much does installation cost?","Free installation up to 1 year, with no deposit and no annual contracts."],["Are plans unlimited?","Yes, all plans offer unlimited data."],["How do I pay my bill?","Use Pay Bill with UPI, cards or net banking."],["I forgot my password","Use the reset link on the login page or contact support."]].map(q=>`<details><summary>${q[0]}</summary><p style="color:var(--mu)">${q[1]}</p></details>`).join("")}`,
coverage:()=>`<h2 style="margin-top:0">Coverage Area</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${AREAS.map(a=>`<div class="card">📍 <b>${a}</b><br><span class="pill">Available</span></div>`).join("")}</div>
<h2>Check Availability</h2><form onsubmit="sub(event,'Thanks! We will confirm availability for your address shortly.')"><label>Area<select>${AREAS.map(a=>`<option>${a}</option>`).join("")}</select></label>${f("m","Mobile Number","tel")}<button class="btn">Check</button></form>`,
contact:()=>`<h2 style="margin-top:0">Contact Us</h2><div class="grid"><div><div class="card"><h3>📞 Phone</h3><p><a href="tel:+919881423530">98814 23530</a></p></div><div class="card" style="margin-top:14px"><h3>✉️ Email</h3><p><a href="mailto:raj860077@gmail.com">raj860077@gmail.com</a></p></div></div>
<div class="map"><div>🗺️ Chikhali | Dehugaon, Pune<br><small>Google Maps embed is blocked on hosted pages; add the iframe in the Next.js build.</small></div></div></div>
<h2>Send a message</h2><form onsubmit="sub(event,'Message sent. We will get back to you soon.')">${f("n","Name")}${f("e","Email","email")}<label>Message<textarea rows="4" required></textarea></label><button class="btn">Send</button></form>`};
function sub(e,m){e.preventDefault();const f=e.target;f.querySelector(".ok")?.remove();f.insertAdjacentHTML("beforeend",done(m));f.reset?.()}
function counters(){document.querySelectorAll("[data-n]").forEach(el=>{const t=+el.dataset.n;let s=null;const st=ts=>{s??=ts;const p=Math.min((ts-s)/1400,1);el.textContent=Math.floor(t*p).toLocaleString("en-IN")+(p==1&&t>=1000?"+":"");if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
function go(){const h=PAGES.includes(location.hash.slice(1))?location.hash.slice(1):"home";
document.getElementById("nav").innerHTML=PAGES.map(p=>`<a href="#${p}" class="${p==h?"on":""}">${LBL[p]}</a>`).join("");
document.getElementById("app").innerHTML=V[h]();if(h=="home")counters()}
addEventListener("hashchange",()=>{window.scrollTo(0,0);go()});go();
</script></body></html>
